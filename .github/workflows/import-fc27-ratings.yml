name: Import official FC 27 ratings

on:
  push:
    branches: [main]
    paths:
      - "scripts/import_fc27_ratings.py"
      - "sql/004_fc27_player_catalog_and_position_training.sql"
      - ".github/workflows/import-fc27-ratings.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sm27-fc27-ratings-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Import official FC 27 ratings
        env:
          DATABASE_URL: ${{ secrets.SM27_DATABASE_URL }}
        run: |
          test -n "$DATABASE_URL" || (echo "Missing SM27_DATABASE_URL repository secret" && exit 1)
          python scripts/import_fc27_ratings.py
